# Phase 1 Docker Compose Overrides
# Extends upstream/docker-compose.yml with:
# 1. Whiteboard service (Excalidraw backend)
# 2. Optional Jibri recording service (profile: recording)
# 3. Health checks for all services
# 4. Bounded container logging to prevent disk exhaustion

services:
  web:
    volumes:
      - ./docker/jitsi/web-default-site.tpl:/defaults/default:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k http://localhost:80/ || curl -f -k https://localhost:443/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prosody:
    volumes:
      - ./docker/prosody/mod_token_moderation.lua:/prosody-plugins-custom/mod_token_moderation.lua:ro
    healthcheck:
      test: ["CMD-SHELL", "prosodyctl --config /config/prosody.cfg.lua status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jicofo:
    environment:
      - JICOFO_ENABLE_HEALTH_CHECKS=1
      - JICOFO_ENABLE_REST=1
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jvb:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/about/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Whiteboard collaboration service (Excalidraw backend)
  whiteboard:
    image: jitsi/excalidraw-backend:21
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - web
    networks:
      meet.jitsi:
        aliases:
          - whiteboard.meet.jitsi

  # Jibri recording service - Optional Compose profile for Linux hosts with ALSA loopback
  jibri:
    profiles:
      - recording
    image: jitsi/jibri:${JITSI_IMAGE_VERSION:-stable-9955}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ${CONFIG}/jibri:/config:Z
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN
    environment:
      - AUTOSCALER_SIDECAR_KEY_FILE
      - AUTOSCALER_SIDECAR_KEY_ID
      - AUTOSCALER_SIDECAR_GROUP_NAME
      - AUTOSCALER_SIDECAR_HOST_ID
      - AUTOSCALER_SIDECAR_INSTANCE_ID
      - AUTOSCALER_SIDECAR_PORT
      - AUTOSCALER_SIDECAR_REGION
      - AUTOSCALER_SIDECAR_SHUTDOWN_POLLING_INTERVAL
      - AUTOSCALER_SIDECAR_STATS_POLLING_INTERVAL
      - AUTOSCALER_URL
      - CHROMIUM_FLAGS
      - DISPLAY=:0
      - ENABLE_STATS_D
      - IGNORE_CERTIFICATE_ERRORS
      - JIBRI_WEBHOOK_SUBSCRIBERS
      - JIBRI_INSTANCE_ID
      - JIBRI_ENABLE_PROMETHEUS
      - JIBRI_HTTP_API_EXTERNAL_PORT
      - JIBRI_HTTP_API_INTERNAL_PORT
      - JIBRI_RECORDING_RESOLUTION
      - JIBRI_RECORDING_VIDEO_ENCODE_PRESET
      - JIBRI_RECORDING_CONSTANT_RATE_FACTOR
      - JIBRI_RECORDING_FRAMERATE
      - JIBRI_RECORDING_QUEUE_SIZE
      - JIBRI_RECORDING_STREAMING_MAX_BITRATE
      - JIBRI_USAGE_TIMEOUT
      - JIBRI_XMPP_USER
      - JIBRI_XMPP_PASSWORD
      - JIBRI_XORG_HORIZ_SYNC
      - JIBRI_XORG_VERT_REFRESH
      - JIBRI_BREWERY_MUC
      - JIBRI_RECORDER_USER
      - JIBRI_RECORDER_PASSWORD
      - JIBRI_RECORDING_DIR
      - JIBRI_FINALIZE_RECORDING_SCRIPT_PATH
      - JIBRI_STRIP_DOMAIN_JID
      - JIBRI_STATSD_HOST
      - JIBRI_STATSD_PORT
      - LOCAL_ADDRESS
      - PUBLIC_URL
      - TZ
      - XMPP_AUTH_DOMAIN
      - XMPP_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_HIDDEN_DOMAIN
      - XMPP_SERVER
      - XMPP_PORT
      - XMPP_RECORDER_DOMAIN
      - XMPP_TRUST_ALL_CERTS
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - jicofo
    networks:
      meet.jitsi:

  # PostgreSQL database for Laravel application
  postgres:
    image: postgres:16-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-meet_ark}
      POSTGRES_USER: ${DB_USERNAME:-meet_ark}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-meet_ark} -d ${DB_DATABASE:-meet_ark} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      meet.jitsi:

  # Laravel application service
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8088}
      APP_PORT: 8088
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-meet_ark}
      DB_USERNAME: ${DB_USERNAME:-meet_ark}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
      SESSION_DRIVER: database
      JITSI_PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      JWT_APP_ID: ${JWT_APP_ID:-meet_ark_backend}
      JWT_APP_SECRET: ${JWT_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JWT_ACCEPTED_ISSUERS:-meet_ark_backend}
      JWT_ACCEPTED_AUDIENCES: ${JWT_ACCEPTED_AUDIENCES:-meet_ark_platform}
    volumes:
      - ./application:/var/www/html:Z
    ports:
      - "${APP_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/up || curl -f http://localhost:8088/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      meet.jitsi:

