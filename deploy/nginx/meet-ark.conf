# ==============================================================================
# Meet-Ark Edge Reverse Proxy Configuration (Nginx)
#
# Placeholders:
#   - APP_DOMAIN:  e.g. app.yourdomain.com
#   - MEET_DOMAIN: e.g. meet.yourdomain.com
#
# On Ubuntu/Debian host:
#   1. Copy to /etc/nginx/sites-available/meet-ark.conf
#   2. Replace APP_DOMAIN and MEET_DOMAIN with your real domains
#   3. Enable site: ln -s /etc/nginx/sites-available/meet-ark.conf /etc/nginx/sites-enabled/
#   4. Obtain TLS certificates with Certbot:
#      certbot --nginx -d app.yourdomain.com -d meet.yourdomain.com
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection & ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN MEET_DOMAIN;

    # Let's Encrypt / Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Application Domain: app.<domain> (Laravel Web App)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_DOMAIN;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;

    # Modern TLS Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size
    client_max_body_size 25M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Laravel App Container
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. Meeting Domain: meet.<domain> (Jitsi Meet & Whiteboard Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name MEET_DOMAIN;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/MEET_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/MEET_DOMAIN/privkey.pem;

    # Modern TLS Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow IFrame embedding by Meet-Ark application
    add_header X-Frame-Options "ALLOW-FROM https://APP_DOMAIN" always;
    # Content Security Policy frame-ancestors for modern browsers
    add_header Content-Security-Policy "frame-ancestors 'self' https://APP_DOMAIN" always;

    # WebSocket endpoints: XMPP signaling, Colibri bridge, Excalidraw whiteboard
    location ~ ^/(xmpp-websocket|colibri-ws|socket.io)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # BOSH signaling endpoint (fallback / HTTP-bind)
    location = /http-bind {
        proxy_pass http://127.0.0.1:8000/http-bind;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
    }

    # Main Jitsi Web UI and external_api.js
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
